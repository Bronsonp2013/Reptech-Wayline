# CI — mechanizes the WAYLINE_SECURITY.md §11 checklist items that a machine can
# actually verify: the suite (incl. the cross-tenant isolation test), types, lint,
# and a dependency audit. Everything else in §11 stays a human review step.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # The application source is not in this repo yet (root-level configs and docs only).
  # Without `prisma/schema.prisma`, `npm ci` dies in postinstall on `prisma generate`
  # and every step below it is unreachable — so the run fails and emails on every
  # commit, reporting a problem nobody can act on from here.
  #
  # This gate makes `verify` SKIP (not fail) while the source is absent, and start
  # running by itself the moment the source is pushed. Deliberately not `if: false`
  # or a deleted workflow: those stay off long after they should have come back on.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.check.outputs.has_source }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the application source is present
        id: check
        run: |
          # prisma/schema.prisma is the precise sentinel: it is the exact file whose
          # absence breaks `npm ci`, so gating on it can't drift from the real cause.
          if [ -f prisma/schema.prisma ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
            echo "Source present — running full verification." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Verification skipped — application source not in the repo"
              echo
              echo 'No `prisma/schema.prisma`, so `npm ci` cannot complete its'
              echo '`postinstall` (`prisma generate`) and no later step can run.'
              echo
              echo 'This is not a CI defect. Push the application source'
              echo '(`app/`, `lib/`, `components/`, `prisma/`, `tests/`, `public/`)'
              echo 'and this job runs in full automatically — no re-enabling needed.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_source == 'true'

    services:
      # The tenant-isolation tests are DB-backed (WAYLINE_SECURITY.md §4), so the
      # suite needs a real Postgres — not a mock.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wayline
          POSTGRES_PASSWORD: wayline_ci
          POSTGRES_DB: wayline
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wayline -d wayline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wayline:wayline_ci@localhost:5433/wayline?schema=public
      # CI-only throwaway value; real secrets never live in the workflow.
      SESSION_SECRET: ci_only_placeholder_secret_not_used_in_any_deployment
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs postinstall → prisma generate, which needs prisma/schema.prisma.
      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Prisma 7: migrate does not reliably refresh the generated client
      # (WAYLINE_BUILD.md Session 1 note), so regenerate explicitly.
      - name: Regenerate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # `tsc --noEmit` does NOT catch what `next build` catches: Server/Client
      # component boundary violations, static-generation errors, `window` touched on a
      # server path, route-collection failures. Without this step those surface for the
      # first time on the NAS, mid-deploy, after the running app has been torn down.
      - name: Build
        run: npm run build

      # Exercise the Dockerfile itself — the multi-stage prune + non-root path is
      # otherwise validated for the first time on a low-power NAS.
      - name: Build production image
        run: docker build -t wayline-app:ci .

      # Production dependency tree only — dev-tool advisories are triaged separately
      # (WAYLINE_BUILD.md Session 6) and shouldn't gate a deploy.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
